<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Analyzer</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash.
      const theme = localStorage.getItem("theme") || "system";
      const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      // Same for the interface language: Arabic lays the page out right-to-left (see src/lib/i18n.tsx).
      const saved = localStorage.getItem("lang");
      const lang = ["en", "fr", "ar"].includes(saved) ? saved : ["fr", "ar"].includes(navigator.language.slice(0, 2)) ? navigator.language.slice(0, 2) : "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    </script>
  </head>
  <body>
    <div id="root" class="isolate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
